name: Build Prebuilds

on:
  workflow_dispatch:

jobs:
  prebuild:
    name: Prebuild ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            filename: neodax-linux-x64.node
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            filename: neodax-linux-arm64.node
          - runner: macos-latest
            target: darwin-arm64
            filename: neodax-darwin-arm64.node
          - runner: macos-13
            target: darwin-x64
            filename: neodax-darwin-x64.node
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang libnode-dev
      - name: Build JS addon
        run: bash build_js.sh
      - name: Stage prebuild
        run: |
          mkdir -p js/prebuilds
          cp js/neodax.node js/prebuilds/${{ matrix.filename }}
          echo "Prebuild: js/prebuilds/${{ matrix.filename }} ($(du -sh js/prebuilds/${{ matrix.filename }} | cut -f1))"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.target }}
          path: js/prebuilds/${{ matrix.filename }}
          retention-days: 30
