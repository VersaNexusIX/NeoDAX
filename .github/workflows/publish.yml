name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build and test without publishing'
        required: false
        default: 'false'
        type: boolean

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: |
          VERSION=$(node -p "require('./js/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing NeoDAX v$VERSION"

  test:
    name: Test (${{ matrix.runner }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            name: Linux x64
          - runner: macos-latest
            name: macOS ARM64
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang libnode-dev
      - name: Build native core
        run: echo "2" | bash setup.sh
      - name: Build JS addon
        run: bash build_js.sh
      - name: Run tests
        run: node js/test/basic.js

  prebuilds:
    name: Prebuild ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            filename: neodax-linux-x64.node
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            filename: neodax-linux-arm64.node
          - runner: macos-latest
            target: darwin-arm64
            filename: neodax-darwin-arm64.node
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y clang libnode-dev
      - name: Build JS addon
        run: bash build_js.sh
      - name: Stage prebuild
        run: |
          mkdir -p js/prebuilds
          cp js/neodax.node js/prebuilds/${{ matrix.filename }}
      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.target }}
          path: js/prebuilds/${{ matrix.filename }}
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [validate, prebuilds]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          pattern: prebuild-*
          path: js/prebuilds/
          merge-multiple: true
      - name: Verify prebuilds present
        run: |
          for f in neodax-linux-x64.node neodax-linux-arm64.node neodax-darwin-arm64.node; do
            if [ ! -f "js/prebuilds/$f" ]; then
              echo "Missing prebuild: $f"
              exit 1
            fi
            echo "OK: js/prebuilds/$f ($(du -sh js/prebuilds/$f | cut -f1))"
          done
          echo "Note: darwin-x64 not included — Intel Mac users compile from source via npm install"
      - name: Publish to npm
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > js/.npmrc
          npm publish --access public --provenance
        working-directory: js
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Dry run summary
        if: ${{ inputs.dry_run == 'true' }}
        run: echo "Dry run complete — all prebuilds verified. Not publishing."
      - name: Create GitHub Release
        if: ${{ inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: NeoDAX v${{ needs.validate.outputs.version }}
          files: js/prebuilds/*.node
          generate_release_notes: true
