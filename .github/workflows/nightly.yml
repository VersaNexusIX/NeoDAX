name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  nightly:
    name: Nightly regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc clang nodejs libnode-dev
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install node
      - name: Build (Code)
        run: bash setup.sh <<< "2"
      - name: Build (JS)
        run: bash build_js.sh
      - name: Full analysis suite
        run: |
          ./neodax -x    /bin/ls
          ./neodax -X    /bin/ls
          ./neodax -e    /bin/ls
          ./neodax -R .text /bin/ls
          ./neodax -V    /bin/ls
      - name: JS tests
        run: node js/test/basic.js

  notify-on-failure:
    name: Open issue on failure
    runs-on: ubuntu-latest
    needs: nightly
    if: failure()
    steps:
      - uses: actions/checkout@v4
      - name: Create issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly regression failed - ${new Date().toISOString().slice(0,10)}`,
              body: `Nightly CI failed on run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\nCheck the logs for details.`,
              labels: ['regression', 'nightly']
            })
