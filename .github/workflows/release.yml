name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version number (e.g. 1.2.0)'
        required: true
        type: string
      prerelease:
        description: 'Pre-release suffix (e.g. beta.1) — leave empty for stable'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate and compute version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: expected MAJOR.MINOR.PATCH"
            exit 1
          fi
          if [[ -n "$INPUT_PRERELEASE" && ! "$INPUT_PRERELEASE" =~ ^[0-9A-Za-z.-]+$ ]]; then
            echo "Invalid prerelease suffix"
            exit 1
          fi
          FULL="${INPUT_VERSION}${INPUT_PRERELEASE:+-$INPUT_PRERELEASE}"
          if git rev-parse "refs/tags/v${FULL}" >/dev/null 2>&1; then
            echo "Tag v${FULL} already exists"
            exit 1
          fi
          echo "full=${FULL}" >> "$GITHUB_OUTPUT"
          echo "Version: ${FULL}"
      - name: Update version manifests and banner
        env:
          FULL_VERSION: ${{ steps.ver.outputs.full }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const v = process.env.FULL_VERSION;
            for (const file of ['./package.json', './js/package.json']) {
              const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
              pkg.version = v;
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
            }
            const vers = JSON.parse(fs.readFileSync('./vers.json', 'utf8'));
            vers.versi = v;
            fs.writeFileSync('./vers.json', JSON.stringify(vers, null, 2) + '\n');
            const setup = fs.readFileSync('./setup.sh', 'utf8');
            const updated = setup.replace(/v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?/, 'v' + v);
            if (updated === setup && !setup.includes('v' + v)) {
              throw new Error('Failed to update version in setup.sh');
            }
            fs.writeFileSync('./setup.sh', updated);
          "
      - name: Commit and tag
        env:
          FULL_VERSION: ${{ steps.ver.outputs.full }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json js/package.json vers.json setup.sh
          git commit -m "chore: bump version to ${FULL_VERSION}"
          git tag -a "v${FULL_VERSION}" -m "NeoDAX v${FULL_VERSION}"
          git push origin HEAD
          git push origin "v${FULL_VERSION}"
